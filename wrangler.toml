name = "telegram-group-guard-bot"
main = "worker.js"
compatibility_date = "2024-09-01"

# بعد إنشاء الـ KV namespace بالأمر التالي:
#   wrangler kv namespace create BOT_KV
# ضع الـ id الذي يعطيك إياه هنا:
kv_namespaces = [
  { binding = "BOT_KV", id = "PUT_YOUR_KV_NAMESPACE_ID_HERE" }
]

# المتغير غير السري (يمكن أيضاً وضعه كسر عبر wrangler secret put)
[vars]
DEV_ID = "6027967703"

# الأسرار (BOT_TOKEN و WEBHOOK_SECRET) تُضبط عبر الأوامر التالية ولا توضع هنا:
#   wrangler secret put BOT_TOKEN
#   wrangler secret put WEBHOOK_SECRET
